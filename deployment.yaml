apiVersion: apps/v1
kind: Deployment
metadata:
  name: minimalapi-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: minimalapi
  template:
    metadata:
      labels:
        app: minimalapi
    spec:
      containers:
      - name: minimalapi
        image: ghcr.io/yar-zar/minimalapi:latest  # ဒီလိုင်းကို GitHub Actions က အလိုအလျောက် လဲလှယ်ပေးသွားမှာပါ
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
---
apiVersion: v1
kind: Service
metadata:
  name: minimalapi-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: minimalapi
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
