apiVersion: apps/v1
kind: Deployment
metadata:
  name: minimalapi-deployment
  namespace: default
  labels:
    app: minimalapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: minimalapi
  template:
    metadata:
      labels:
        app: minimalapi
    spec:
      containers:
      - name: minimalapi
        image: ghcr.io/yar-zar/minimalapi:sha-8bf4fe3
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
          
        # --- PRO LEVEL HEALTH CHECKS ---
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 30 # App စတက်ရန် စုစုပေါင်း ၁၅၀ စက္ကန့်အထိ အချိန်ပေးမည်

        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
        # -------------------------------

        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: minimalapi-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: minimalapi
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
