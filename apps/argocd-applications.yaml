apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: microservices-appset
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/Yar-Zar/K8s-Manifests-Repository
        revision: HEAD
        files:
          - path: "apps/values/*-service.yaml"  # .gitkeep ပါမပါအောင် -service.yaml လို့ အတိအကျ သုံးပေးခြင်း
  template:
    metadata:
      name: '{{.path.basenameNormalized}}-app'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/Yar-Zar/K8s-Manifests-Repository
        targetRevision: HEAD
        path: helm/microservices-chart
        helm:
          valueFiles:
            - ../../{{.path.path}}  # Chart path (helm/microservices-chart) ကနေ back ဆုတ်ပြီး root က values ကို လှမ်းခေါ်ခြင်း
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
