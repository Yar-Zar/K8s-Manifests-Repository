replicaCount: 2

image:
  repository: ghcr.io/yar-zar/api-gateway
  tag: "latest"  # GitHub Actions ကနေ commit sha ဖြင့် အလိုအလျောက် Update လုပ်မည်
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer  # Gateway ဖြစ်သည့်အတွက် ပြင်ပမှ ဝင်ရောက်နိုင်ရန် LoadBalancer သို့မဟုတ် Ingress သုံးရပါမည်
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

env:
  - name: ASPNETCORE_ENVIRONMENT
    value: "Production"
