replicaCount: 2

image:
  repository: ghcr.io/yar-zar/payment-service
  tag: "latest"  # GitHub Actions ကနေ commit sha ဖြင့် အလိုအလျောက် Update လုပ်မည်
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

env:
  - name: ASPNETCORE_ENVIRONMENT
    value: "Production"
