# Default values for microservices-chart.
# Production-ready configuration for .NET 8 Microservices

replicaCount: 2

image:
  repository: ghcr.io/yar-zar/microservice-placeholder # Service တစ်ခုချင်းစီ၏ values ဖိုင်တွင် အစားထိုးမည်
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Pod-level security context defaults
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 3000
  fsGroup: 2000

# Container-level security context defaults
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false  # .NET applications များအတွက် temp files ရေးရန် လိုအပ်နိုင်သဖြင့် false ထားခြင်းသည် ပိုအဆင်ပြေပါသည်
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# Horizontal Pod Autoscaler (Production အတွက် enabled လုပ်ထားသည်)
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# Probes (.NET 8 Health Checks များအတွက် သင့်လျော်သော path များ)
probes:
  liveness:
    path: /health
    port: 8080
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /health
    port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  startup:
    enabled: true
    path: /health
    port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30

# Environment variables
env:
  - name: ASPNETCORE_ENVIRONMENT
    value: "Production"
  - name: LOG_LEVEL
    value: "Information"

# Node selector, tolerations and affinity
nodeSelector: {}
affinity: {}
tolerations: []

# Pod annotations and labels
podAnnotations: {}
podLabels: {}

# Deployment strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%

# Extra volumes and mounts
extraVolumes: []
extraVolumeMounts: []

# Service Account
serviceAccount:
  create: true
  name: ""
